services:
  - type: web
    name: faturamento-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      # O default do Render é 3.14, que ainda não tem wheel pronta pra várias
      # libs — fixar aqui evita build compilando C/Rust do zero (e falhando).
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        value: "sqlite:///./dev.db"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: "HS256"
      - key: JWT_EXPIRE_MINUTES
        value: "480"
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false
      - key: UPLOAD_DIR
        value: "./uploads"
      - key: GENERATED_DIR
        value: "./generated"

  - type: web
    name: faturamento-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    envVars:
      # Ajuste depois do primeiro deploy do backend se a URL real vier diferente
      # desta (o Render só usa outro nome se "faturamento-backend" já estiver em
      # uso por outra conta) — Settings > Environment nesse serviço no Render.
      - key: VITE_API_URL
        value: "https://faturamento-backend.onrender.com"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
